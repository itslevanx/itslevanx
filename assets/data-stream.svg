<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-labelledby="title desc">
  <title id="title">Animated data stream</title><desc id="desc">Packets of data flow through a futuristic processing channel.</desc>
  <defs>
    <linearGradient id="dbg" x2="1"><stop stop-color="#080d20"/><stop offset=".5" stop-color="#111936"/><stop offset="1" stop-color="#080d20"/></linearGradient>
    <linearGradient id="beam" x2="1"><stop stop-color="#00e5ff" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></linearGradient>
    <filter id="dglow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.packet{animation:move 5s linear infinite}.bits{stroke-dasharray:5 19;animation:bits 2s linear infinite}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes move{from{transform:translateX(-180px)}to{transform:translateX(1050px)}}@keyframes bits{to{stroke-dashoffset:-48}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  </defs>
  <rect x="1" y="1" width="998" height="148" rx="18" fill="url(#dbg)" stroke="#26375d"/>
  <path d="M35 75h930" stroke="#294066" stroke-width="2"/><path d="M35 61h930M35 89h930" stroke="#00e5ff" stroke-opacity=".25" class="bits"/>
  <g transform="translate(180)" fill="#0d1c37" stroke="#00e5ff" filter="url(#dglow)" class="packet"><rect x="0" y="52" width="74" height="46" rx="8"/><text x="37" y="80" text-anchor="middle" fill="#b8f9ff" font-family="ui-monospace,monospace" font-size="11">DATA_01</text></g>
  <g transform="translate(450)" fill="#0d1c37" stroke="#a855f7" filter="url(#dglow)" class="packet" style="animation-delay:-1.7s"><rect x="0" y="52" width="74" height="46" rx="8"/><text x="37" y="80" text-anchor="middle" fill="#ead7ff" font-family="ui-monospace,monospace" font-size="11">VECTOR</text></g>
  <g transform="translate(720)" fill="#0d1c37" stroke="#3cffb5" filter="url(#dglow)" class="packet" style="animation-delay:-3.4s"><rect x="0" y="52" width="74" height="46" rx="8"/><text x="37" y="80" text-anchor="middle" fill="#c8ffe9" font-family="ui-monospace,monospace" font-size="11">INSIGHT</text></g>
  <circle cx="500" cy="75" r="38" fill="#0d1932" stroke="#00e5ff" stroke-opacity=".7" class="pulse"/><path d="M482 75h36M500 57v36" stroke="url(#beam)" stroke-width="2" filter="url(#dglow)"/>
  <text x="28" y="29" fill="#6f86ae" font-family="ui-monospace,monospace" font-size="10" letter-spacing="2">RAW SIGNAL</text><text x="972" y="29" text-anchor="end" fill="#6f86ae" font-family="ui-monospace,monospace" font-size="10" letter-spacing="2">ACTIONABLE INTELLIGENCE</text>
</svg>
