<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="112" viewBox="0 0 1000 112" role="img" aria-labelledby="title desc">
  <title id="title">Identity synthesis protocol</title>
  <desc id="desc">An animated signal travels from human identity through nanotechnology to a neural core.</desc>
  <defs>
    <linearGradient id="rail" x2="1"><stop stop-color="#00c8ff"/><stop offset=".52" stop-color="#e8fdff"/><stop offset="1" stop-color="#49e6ff"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.rail{stroke-dasharray:7 13;animation:flow 1.8s linear infinite}.node{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.n2{animation-delay:-.8s}.n3{animation-delay:-1.6s}@keyframes flow{to{stroke-dashoffset:-40}}@keyframes pulse{50%{opacity:.42;transform:scale(.72)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  </defs>
  <rect x="1" y="1" width="998" height="110" rx="16" fill="#080d20" stroke="#26375d"/>
  <path d="M155 52H845" stroke="#253b63" stroke-width="4"/><path d="M155 52H845" stroke="url(#rail)" stroke-width="2" class="rail"/>
  <g filter="url(#glow)"><circle cx="155" cy="52" r="11" fill="#00c8ff" class="node"/><circle cx="500" cy="52" r="11" fill="#e8fdff" class="node n2"/><circle cx="845" cy="52" r="11" fill="#49e6ff" class="node n3"/></g>
  <g class="mono" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2"><text x="155" y="90" fill="#72eaff">HUMAN.IDENTITY</text><text x="500" y="90" fill="#d8faff">NANO.PARTICLES</text><text x="845" y="90" fill="#72eaff">NEURAL.CORE</text></g>
</svg>
