<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
  <title id="title">Contribution matrix initializing</title><desc id="desc">Animated local fallback shown until GitHub Actions generates the live contribution snake.</desc>
  <defs><pattern id="grid" width="17" height="17" patternUnits="userSpaceOnUse"><rect width="11" height="11" rx="2" fill="#13213d"/><rect width="11" height="11" rx="2" fill="none" stroke="#27416c" stroke-width=".7"/></pattern><linearGradient id="snake" x2="1"><stop stop-color="#00e5ff"/><stop offset=".55" stop-color="#a855f7"/><stop offset="1" stop-color="#3cffb5"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.trail{stroke-dasharray:90 900;animation:run 6s linear infinite}.scan{animation:scan 3s ease-in-out infinite}@keyframes run{to{stroke-dashoffset:-990}}@keyframes scan{0%,100%{transform:translateX(-100px);opacity:0}50%{transform:translateX(1100px);opacity:.7}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
  <rect x="1" y="1" width="998" height="188" rx="18" fill="#080d20" stroke="#26375d"/><rect x="49" y="43" width="902" height="102" fill="url(#grid)"/>
  <path d="M55 52H930V86H72v34h858" fill="none" stroke="url(#snake)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" class="trail" filter="url(#glow)"/>
  <rect x="0" y="34" width="80" height="120" fill="url(#snake)" opacity=".13" class="scan"/>
  <text x="50" y="27" fill="#7189b3" font-family="ui-monospace,monospace" font-size="10" letter-spacing="2">CONTRIBUTION MATRIX // LOCAL FALLBACK</text><text x="950" y="172" text-anchor="end" fill="#3cffb5" font-family="ui-monospace,monospace" font-size="10">AWAITING LIVE SYNC</text>
</svg>
